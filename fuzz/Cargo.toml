path = "fuzz_targets/fuzz_record.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wal"
path = "fuzz_targets/fuzz_wal.rs"
test = false
doc = false

[[bin]]
name = "fuzz_database"
path = "fuzz_targets/fuzz_database.rs"
test = false
doc = false

[workspace]
